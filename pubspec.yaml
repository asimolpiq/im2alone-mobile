name: im2alone
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  rename: ^2.1.1
  cupertino_icons: ^1.0.2
  #network
  dio: ^5.3.2
  #localization
  easy_localization: ^3.0.2
  #state management
  get: ^4.6.5
  #caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  #connectivity
  connectivity_plus: ^6.0.5

  #utils
  flutter_svg: ^2.0.7
  flutter_widget_from_html: ^0.10.4
  webview_flutter: ^4.9.0
  auto_size_text: ^3.0.0
  confetti: ^0.7.0
  quill_html_editor: ^2.2.8
  image_picker: ^1.1.2

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  file_picker: 10.0.0
  wakelock_plus: 1.5.2
  wakelock_plus_platform_interface: ^1.4.0
  quill_html_editor:
    path: third_party/quill_html_editor

flutter:
  uses-material-design: true

  assets:
    - assets/
  fonts: 
      - family: Comfortaa
        fonts: 
          - asset: fonts/Comfortaa-Regular.ttf
          - asset: fonts/Comfortaa-Bold.ttf
            weight: 700
          - asset: fonts/Comfortaa-Light.ttf
            weight: 300
          - asset: fonts/Comfortaa-Medium.ttf
            weight: 500
          - asset: fonts/Comfortaa-SemiBold.ttf
            weight: 600